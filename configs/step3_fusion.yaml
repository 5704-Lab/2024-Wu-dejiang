schema_version: step3-fusion-config-v1
roadmap_step: 3.5-B
inputs:
  step2_config: configs/step2_dataset.yaml
  step1_root: artifacts/step1
  step2_root: artifacts/step2
  dataset_root: "../../project/数据集/VOCdevkit/VOC2007"
  alignment_validation_report: artifacts/step3/alignment_report.json
  alignment_frozen_parameters: artifacts/step3/alignment_parameters_frozen.json
  alignment_validation_manifest: artifacts/step3/run_manifest.json
  alignment_test_report: artifacts/step3/test/alignment_report.json
  alignment_test_manifest: artifacts/step3/test/run_manifest.json
  predictor_checkpoint: artifacts/step3/training/checkpoint_best.pt
  fusion_checkpoint: artifacts/step3/fusion_training/checkpoint_best.pt
output:
  root: artifacts/step3/fusion
model:
  kernel_size: 3
  hidden_ratio: 4
  zero_init: true
  max_offset: 3.0
fusion:
  hidden: 128
  reduction: 16
  spatial_kernel: 7
heatmap:
  sample_count: 4
run:
  purpose: fusion_smoke
  split: val
  selection: ordered_prefix
  sample_count: 4
  batch_size: 1
  num_workers: 0
  device: auto
  inference_dtype: float32
