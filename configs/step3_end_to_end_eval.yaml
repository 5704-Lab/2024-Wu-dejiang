schema_version: step3-e2e-eval-config-v1
roadmap_step: "6"
inputs:
  step2_config: configs/step2_dataset.yaml
  step1_root: artifacts/step1
  step2_root: artifacts/step2
  dataset_root: "data/VOC2007"
  alignment_validation_report: artifacts/step3/alignment_report.json
  alignment_frozen_parameters: artifacts/step3/alignment_parameters_frozen.json
  alignment_validation_manifest: artifacts/step3/run_manifest.json
  alignment_test_report: artifacts/step3/test/alignment_report.json
  alignment_test_manifest: artifacts/step3/test/run_manifest.json
  predictor_checkpoint: artifacts/step3/training/checkpoint_best.pt
  fusion_checkpoint: artifacts/step3/fusion_training/checkpoint_best.pt
  proposal_frozen_parameters: artifacts/step3/tuning/proposal_parameters_frozen.json
  rtdetr_checkpoint: artifacts/step5/rtdetr_paired_baseline/train/weights/best.pt
  test_annotation_patch: artifacts/step1/test_annotation_patch.jsonl
output:
  root: artifacts/step3/e2e_eval
model:
  kernel_size: 3
  hidden_ratio: 4
  zero_init: true
  max_offset: 3.0
fusion:
  hidden: 128
  reduction: 16
detection:
  imgsz: 800
  conf: 0.25
  iou: 0.7
  iou_eval: 0.5
  diff_scale: 3.0
gating:
  gate_heatmap: true
  gate_prob_threshold: 0.5
  gate_max_min: 0.6
  gate_min_positive_fraction: 0.03
run:
  split: val
  batch_size: 1
  num_workers: 0
  device: auto
