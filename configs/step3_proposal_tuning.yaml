# 完整 Validation 后处理调参配置。严禁将 split 改为 test，Test 只用于冻结后的最终评估。
schema_version: step3-proposal-tuning-config-v1
inputs:
  step2_config: configs/step2_dataset.yaml
  predictor_checkpoint: artifacts/step3/training/checkpoint_best.pt
  fusion_checkpoint: artifacts/step3/fusion_training/checkpoint_best.pt
output:
  root: artifacts/step3/tuning
model:
  kernel_size: 3
  hidden_ratio: 4
  max_offset: 3.0
fusion:
  hidden: 128
  reduction: 16
run:
  split: val
  selection: full_split
  expected_sample_count: 400
  batch_size: 1
  num_workers: 0
  device: auto
search:
  # 第一轮采用较宽的概率阈值范围；所有组合都只在缓存热力图上运行。
  probability_thresholds: [0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]
  morph_kernels: [3, 5, 7, 9]
  min_areas: [32, 64, 128]
  max_aspect_ratios: [5.0, 8.0]
  max_area_ratio: 0.8
  # 细搜索扩大候选保留数，避免候选数量惩罚过早排除高召回组合。
  top_proposal_configs: 50
  expand_factors: [3.0, 3.5, 4.0, 4.5]
  merge_iou_thresholds: [0.1, 0.2, 0.3, 0.4]
