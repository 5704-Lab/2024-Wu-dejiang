schema_version: step3-backbone-config-v1
roadmap_step: 3.3-B
inputs:
  step2_config: configs/step2_dataset.yaml
  step1_root: artifacts/step1
  step2_root: artifacts/step2
  dataset_root: "../../project/数据集/VOCdevkit/VOC2007"
  alignment_validation_report: artifacts/step3/alignment_report.json
  alignment_frozen_parameters: artifacts/step3/alignment_parameters_frozen.json
  alignment_validation_manifest: artifacts/step3/run_manifest.json
  alignment_test_report: artifacts/step3/test/alignment_report.json
  alignment_test_manifest: artifacts/step3/test/run_manifest.json
output:
  root: artifacts/step3/backbone
model:
  architecture: resnet50
  weights: IMAGENET1K_V2
  trainable: true
  input_range: [0.0, 1.0]
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  multi_scale_output: true
  feature_stages:
    - name: C3
      stage: layer2
      channels: 512
      stride: 8
    - name: C4
      stage: layer3
      channels: 1024
      stride: 16
    - name: C5
      stage: layer4
      channels: 2048
      stride: 32
run:
  purpose: backbone_smoke
  split: val
  selection: ordered_prefix
  sample_count: 2
  batch_size: 1
  num_workers: 0
  device: auto
  inference_dtype: float32
  expected_height: 800
  expected_width: 800
